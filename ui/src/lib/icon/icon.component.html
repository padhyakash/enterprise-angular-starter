<span
  class="icon"
  [class.icon--sm]="size() === 'sm'"
  [class.icon--md]="size() === 'md'"
  [class.icon--lg]="size() === 'lg'"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : 'true'"
>
  @if (name() === 'eye') {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  }

  @if (name() === 'eye-off') {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 3l18 18" />
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
      <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c7 0 10 8 10 8a17.3 17.3 0 0 1-3.2 4.4" />
      <path d="M6.2 6.2C3.6 8.2 2 12 2 12s3.5 8 10 8a10.8 10.8 0 0 0 3.3-.5" />
    </svg>
  }
</span>
