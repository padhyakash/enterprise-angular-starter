<div class="showcase">
  <h1>Enterprise Angular Starter</h1>

  <p class="showcase__subtitle">
    Reusable UI components built with Angular 22, Signals and Vitest.
  </p>

  <section class="showcase__section">
    <h2>Buttons</h2>

    <div class="showcase__row">
      <lib-button variant="primary">Primary</lib-button>
      <lib-button variant="secondary">Secondary</lib-button>
      <lib-button variant="success">Success</lib-button>
      <lib-button variant="danger">Danger</lib-button>
    </div>

    <div class="showcase__row">
      <lib-button size="sm">Small</lib-button>
      <lib-button size="md">Medium</lib-button>
      <lib-button size="lg">Large</lib-button>
    </div>

    <div class="showcase__row">
      <lib-button [disabled]="true">Disabled</lib-button>
      <lib-button [loading]="true">Loading</lib-button>
    </div>
  </section>

  <section class="showcase__section">
    <h2>Input</h2>

    <div class="showcase__form">
      <lib-input label="Email" placeholder="Enter your email"> </lib-input>

      <lib-input label="Password" type="password" [showPasswordToggle]="true"> </lib-input>

      <lib-input label="Username" value="akashpadhy" [readonly]="true"> </lib-input>

      <lib-input label="Disabled Input" value="Disabled" [disabled]="true"> </lib-input>

      <lib-input label="Email" [invalid]="true" error="Email is required"> </lib-input>
    </div>
  </section>

  <section class="showcase__section">
    <h2>Icons</h2>

    <div class="showcase__row showcase__icons">
      <div class="showcase__icon">
        <lib-icon name="eye" size="sm"></lib-icon>
        <span>Small</span>
      </div>

      <div class="showcase__icon">
        <lib-icon name="eye" size="md"></lib-icon>
        <span>Medium</span>
      </div>

      <div class="showcase__icon">
        <lib-icon name="eye" size="lg"></lib-icon>
        <span>Large</span>
      </div>

      <div class="showcase__icon">
        <lib-icon name="eye-off" size="md"></lib-icon>
        <span>Eye Off</span>
      </div>
    </div>
  </section>
</div>
